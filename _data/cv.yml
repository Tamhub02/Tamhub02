        summary: Developing deep learning models and high-throughput computer vision pipelines for computational pathology.
        highlights:
          - "Built a ConvNeXt-Tiny and UNet segmentation pipeline for whole slide images, addressing severe 602:1 class imbalance using log-smoothed Focal and Dice loss to achieve a 0.8003 Validation Dice score."
          - "Developed an asynchronous multithreaded tile streaming and stitching pipeline for 50GB+ pyramidal TIFF/SVS slides with OpenSlide, reducing reconstruction latency by 4.2x with zero memory leaks."
          - "Fine-tuned Qwen2.5-VL models using LoRA and Chain-of-Thought reasoning for histopathology tasks, implementing a multi-agent consensus system for diagnostic agreement."
          - "Benchmarked Faster R-CNN, RetinaNet, RTMDet, and YOLOX on cellular structures using MMDetection, building custom visual inspection tools for bounding box validation."
          - "Implemented patch-level feature extraction and k-NN anomaly scoring pipelines to identify out-of-distribution tissue regions."

